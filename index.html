<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAM-LLM Benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Flat Design, light mode. Tokens map the design system to plain CSS vars so
     the zero-build static deploy stays intact. White color-block panels on a
     gray-100 canvas give edges without shadows (shadows are banned here). */
  :root {
    --canvas:#f3f4f6;   /* gray-100  — page */
    --panel:#ffffff;    /* white     — color-block card */
    --fg:#111827;       /* gray-900  — text */
    --muted:#6b7280;    /* gray-500  — secondary text */
    --line:#e5e7eb;     /* gray-200  — sparse separators */
    --primary:#3b82f6;  /* blue-500  — action */
    --primary-d:#2563eb;/* blue-600  — hover */
    --secondary:#10b981;/* emerald-500 */
    --accent:#f59e0b;   /* amber-500 */
    --ok:#059669;       /* emerald-600 — AA on white */
    --bad:#dc2626;      /* red-600     — AA on white */
    --r:8px;            /* rounded-lg */
    --rm:6px;           /* rounded-md */
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font:15px/1.5 'Outfit', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background:var(--canvas); color:var(--fg);
    -webkit-font-smoothing:antialiased;
  }
  /* Poster decoration: one large flat circle, very low opacity, behind content. */
  body::before {
    content:""; position:fixed; top:-160px; right:-160px;
    width:460px; height:460px; border-radius:9999px;
    background:var(--primary); opacity:.05; pointer-events:none; z-index:0;
  }
  header, .bar, .tabs, main { position:relative; z-index:1;
    max-width:1200px; margin-left:auto; margin-right:auto; }

  header { padding:32px 28px 4px; }
  h1 { font-size:30px; font-weight:800; letter-spacing:-.02em; margin:0;
       display:flex; align-items:center; gap:12px; }
  h1::before { content:""; width:18px; height:18px; border-radius:5px;
               background:var(--primary); display:inline-block; }
  .sub { color:var(--muted); font-size:13px; margin-top:6px; }

  /* Controls = a flat white block on the gray canvas. */
  .bar { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
         margin:18px 28px 0; padding:14px 18px;
         background:var(--panel); border-radius:var(--r); }
  .bar .group { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .bar label { color:var(--fg); font-size:13px; font-weight:500;
               display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .bar input[type=checkbox] { accent-color:var(--primary); width:15px; height:15px; }
  a.logout { color:var(--muted); font-size:13px; font-weight:600; text-decoration:none;
             margin-left:auto; text-transform:uppercase; letter-spacing:.04em;
             transition:color .2s; }
  a.logout:hover { color:var(--fg); }

  /* Tabs: flat blocks. Active = solid primary, white text. No skeuomorphic merge. */
  .tabs { display:flex; gap:8px; padding:0 28px; margin-top:16px; flex-wrap:wrap; }
  .tab { padding:9px 16px; border-radius:var(--rm); background:transparent;
         color:var(--muted); border:0; cursor:pointer;
         font:600 14px 'Outfit', sans-serif; transition:all .2s; }
  .tab:hover { background:var(--panel); color:var(--fg); }
  .tab.active { background:var(--primary); color:#fff; }
  .tab.active:hover { background:var(--primary-d); }

  main { padding:16px 28px 48px; }
  /* Panel: white color block. No border, no shadow, generous padding. */
  .panel { background:var(--panel); border-radius:var(--r); padding:28px 28px 22px; }
  h2 { font-size:20px; font-weight:700; letter-spacing:-.01em; margin:0 0 4px; }
  .note { color:var(--muted); font-size:13px; margin:10px 0 0; }

  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:10px 14px; border-bottom:1px solid var(--line);
           white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0;
                                   background:var(--panel); }
  thead th { color:var(--muted); font-weight:600; font-size:11px;
             text-transform:uppercase; letter-spacing:.05em; }
  thead th.grp { border-bottom:2px solid var(--primary); }
  tbody tr:hover td { background:rgba(59,130,246,.06); }
  td.model { font-weight:700; }
  .logo { width:16px; height:16px; vertical-align:-3px; margin-right:7px; }
  td.dash { color:var(--muted); }
  .ci { color:var(--muted); font-size:12px; margin-left:4px; }

  tr.expandable { cursor:pointer; }
  .caret { display:inline-block; width:12px; color:var(--muted); font-size:10px;
           transition:transform .2s ease; }
  tr.open > td > .caret, tr.open > td .caret { transform:rotate(90deg); }
  tr.detail.hidden { display:none; }
  /* Nested detail = a flat muted block (gray-100) inside the white panel. */
  td.detailcell { text-align:left; background:var(--canvas); padding:14px 18px;
                  border-radius:var(--rm); }
  td.detailcell, td.detailcell:first-child { position:static; }
  table.subtable { margin:2px 0; }
  table.subtable th, table.subtable td { border-bottom:1px solid var(--line); }
  table.subtable td:first-child, table.subtable th:first-child { background:transparent; }
  .detail-h { color:var(--muted); font-size:11px; text-transform:uppercase;
              letter-spacing:.05em; font-weight:600; margin:14px 0 6px; }
  .camsum { padding:2px 0; }
  .camsum-setup { font-size:13px; margin:8px 0 4px; }
  table.camsum-ops td, table.camsum-ops th { font-size:12px; padding:5px 12px; }
  .transcript { padding:6px 0 2px; }
  .transcript .prov { margin:0 0 6px; font-size:12px; }
  ol.tcalls { margin:0; padding-left:20px; color:var(--fg); }
  ol.tcalls li { padding:2px 0; font-size:13px; white-space:normal; }
  ol.tcalls code { color:var(--fg); }
  ol.tcalls .args { color:var(--muted); font-size:12px; }
  .args { color:var(--muted); }
  .ok { color:var(--ok); font-weight:700; }
  .bad { color:var(--bad); font-weight:700; }

  /* No shadows → focus must be a hard, high-contrast outline. */
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline:2px solid var(--primary); outline-offset:2px; border-radius:4px;
  }
</style>
</head>
<body>
  <header>
    <h1>CAM-LLM Benchmark</h1>
    <div class="sub" id="sub">loading…</div>
  </header>
  <div class="bar">
    <label><input type="checkbox" id="ci" checked> 95% CI</label>
    <div class="group" id="groups"></div>
    <a class="logout" href="/logout">sign out</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <main><div class="panel" id="panel"></div></main>
  <script src="app.js"></script>
</body>
</html>
